<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>离线中 - MoYun</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #faf7f0;
        color: #2a2722;
        font-family: "Ma Shan Zheng", "Noto Sans SC", "PingFang SC", serif;
      }
      .card {
        width: min(92vw, 420px);
        border: 2px dashed #c8bda8;
        border-radius: 10px 16px 8px 14px;
        padding: 30px 26px;
        text-align: center;
        background: rgba(255, 253, 247, 0.74);
        box-shadow: 4px 4px 0 rgba(151, 137, 109, 0.2);
      }
      .icon {
        width: 48px;
        height: 48px;
        margin: 0 auto 14px;
        border: 2px dashed #97896d;
        border-radius: 12px 16px 10px 14px;
        display: grid;
        place-items: center;
        color: #5b57d1;
      }
      .icon svg {
        width: 24px;
        height: 24px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 26px;
        font-weight: 400;
        color: #5b57d1;
      }
      p {
        margin: 0;
        color: #7c766a;
        font-size: 16px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon">
        <svg viewBox="0 0 24 24"><path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0 1 19 12.55M5 12.55a10.94 10.94 0 0 1 5.17-2.39M10.71 5.05A16 16 0 0 1 22.58 9M1.42 9a15.91 15.91 0 0 1 4.7-2.88M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/></svg>
      </div>
      <h1>当前离线</h1>
      <p>网络恢复后可继续搜索与播放。</p>
    </main>
  </body>
</html>
