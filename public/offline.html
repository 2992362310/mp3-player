<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>离线中 - MoYun</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f1f5f9;
        background-image: radial-gradient(ellipse 80% 50% at 20% -10%, rgba(99, 102, 241, 0.06), transparent),
                          radial-gradient(ellipse 60% 40% at 90% 10%, rgba(167, 139, 250, 0.05), transparent);
        color: #0f172a;
        font-family: "Inter", "Noto Sans SC", system-ui, -apple-system, sans-serif;
      }
      .card {
        width: min(92vw, 420px);
        border: 1px solid rgba(15, 23, 42, 0.08);
        border-radius: 16px;
        padding: 32px 28px;
        text-align: center;
        background: rgba(255, 255, 255, 0.72);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06), 0 16px 40px rgba(15, 23, 42, 0.08);
      }
      .icon {
        width: 48px;
        height: 48px;
        margin: 0 auto 16px;
        border-radius: 50%;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        display: grid;
        place-items: center;
      }
      .icon svg {
        width: 24px;
        height: 24px;
        stroke: #fff;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        color: #64748b;
        font-size: 14px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon">
        <svg viewBox="0 0 24 24"><path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0 1 19 12.55M5 12.55a10.94 10.94 0 0 1 5.17-2.39M10.71 5.05A16 16 0 0 1 22.58 9M1.42 9a15.91 15.91 0 0 1 4.7-2.88M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/></svg>
      </div>
      <h1>当前离线</h1>
      <p>网络恢复后可继续搜索与播放。</p>
    </main>
  </body>
</html>
