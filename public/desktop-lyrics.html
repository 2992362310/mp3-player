<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>桌面歌词 · 墨韵</title>
  <style>
    :root {
      --accent: #5b57d1;
      --paper: #faf7f0;
      --ink: #2d2d2d;
      --ui-display: "Ma Shan Zheng", "Noto Serif SC", serif;
      --stroke: var(--ink);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--ui-display);
      display: flex;
      flex-direction: column;
      padding: 10px 12px 8px;
      gap: 8px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-bottom: 7px;
      border-bottom: 1px dashed var(--stroke);
      flex: none;
    }

    .meta {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      line-height: 1.25;
    }

    .title {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .artist {
      font-size: 11px;
      opacity: 0.62;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 4px;
      flex: none;
    }

    button {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1.5px solid var(--stroke);
      border-radius: 6px 9px 5px 8px;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    button:hover { background: color-mix(in srgb, var(--accent) 16%, transparent); }
    button:active { transform: translate(1px, 1px); }
    button:focus-visible { outline: 2px dashed var(--accent); outline-offset: 2px; }
    button svg { width: 15px; height: 15px; }

    .lines {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      overflow: hidden;
    }

    .line {
      padding: 3px 8px;
      border-left: 3px solid transparent;
      border-radius: 3px 8px 3px 8px;
      font-size: 14px;
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 0.42;
      cursor: pointer;
      transition: opacity 0.2s, color 0.2s;
    }

    .line.prev,
    .line.next { font-size: 13px; }

    .line.current {
      opacity: 1;
      color: var(--accent);
      border-left-color: var(--accent);
      font-size: 19px;
      font-weight: 700;
      box-shadow: 3px 3px 0 color-mix(in srgb, var(--accent) 22%, transparent);
    }

    .translation {
      display: block;
      font-size: 0.72em;
      opacity: 0.7;
    }

    .empty {
      opacity: 0.5;
      font-size: 14px;
      text-align: center;
    }

    footer {
      flex: none;
      font-size: 10px;
      opacity: 0.4;
      text-align: right;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-themed]) { --paper: #1a1d22; --ink: #e8e8e8; }
    }
  </style>
</head>
<body>
  <header>
    <div class="meta">
      <span class="title" id="title">墨韵</span>
      <span class="artist" id="artist">准备播放</span>
    </div>
    <div class="controls">
      <button type="button" id="prev" title="上一首" aria-label="上一首">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M6.8 5V19" />
          <path d="M17.5 5.2L8.2 12L17.5 18.8Z" fill="currentColor" stroke="none" />
        </svg>
      </button>
      <button type="button" id="playpause" title="播放/暂停" aria-label="播放或暂停">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path id="play-icon" d="M8.2 4.8C7.8 4.6 7.2 4.9 7.2 5.4V18.6C7.2 19.1 7.8 19.4 8.2 19.2L19.1 12.9C19.5 12.7 19.5 12.1 19.1 11.8L8.2 4.8Z" fill="currentColor" stroke="none" />
          <g id="pause-icon" style="display:none" fill="currentColor" stroke="none">
            <rect x="7" y="5" width="3.2" height="14" rx="1" />
            <rect x="13.8" y="5" width="3.2" height="14" rx="1" />
          </g>
        </svg>
      </button>
      <button type="button" id="next" title="下一首" aria-label="下一首">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M17.2 5V19" />
          <path d="M6.5 5.2L15.8 12L6.5 18.8Z" fill="currentColor" stroke="none" />
        </svg>
      </button>
      <button type="button" id="close" title="关闭桌面歌词" aria-label="关闭桌面歌词">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M6 6L18 18M18 6L6 18" />
        </svg>
      </button>
    </div>
  </header>

  <div class="lines" id="lines"></div>
  <footer>点击歌词可跳转</footer>

  <script>
    (function () {
      var channel = new BroadcastChannel('moyun-desktop-lyrics');
      var linesEl = document.getElementById('lines');
      var titleEl = document.getElementById('title');
      var artistEl = document.getElementById('artist');
      var playIcon = document.getElementById('play-icon');
      var pauseIcon = document.getElementById('pause-icon');

      function send(action) {
        channel.postMessage({ type: 'action', action: action });
      }

      document.getElementById('prev').addEventListener('click', function () { send({ type: 'prev' }); });
      document.getElementById('next').addEventListener('click', function () { send({ type: 'next' }); });
      document.getElementById('playpause').addEventListener('click', function () { send({ type: 'playpause' }); });
      document.getElementById('close').addEventListener('click', function () { send({ type: 'close' }); });

      function render(state) {
        var root = document.documentElement;
        root.setAttribute('data-themed', '');
        root.style.setProperty('--accent', state.accent || '#5b57d1');
        root.style.setProperty('--paper', state.paper || '#faf7f0');
        root.style.setProperty('--ink', state.ink || '#2d2d2d');
        root.style.setProperty('--ui-display', state.displayFont || 'cursive');

        titleEl.textContent = state.title || '墨韵';
        artistEl.textContent = state.artist || '准备播放';
        playIcon.style.display = state.playing ? 'none' : '';
        pauseIcon.style.display = state.playing ? '' : 'none';

        var lines = state.lines || [];
        linesEl.textContent = '';
        if (!lines.length) {
          var empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = '暂无歌词';
          linesEl.appendChild(empty);
          return;
        }

        var index = Math.max(0, state.currentIndex || 0);
        for (var offset = -1; offset <= 1; offset++) {
          var i = index + offset;
          if (i < 0 || i >= lines.length) continue;
          var line = lines[i];
          var el = document.createElement('div');
          el.className = 'line ' + (offset === 0 ? 'current' : offset < 0 ? 'prev' : 'next');
          el.textContent = line.text;
          if (line.translation) {
            var tr = document.createElement('span');
            tr.className = 'translation';
            tr.textContent = line.translation;
            el.appendChild(tr);
          }
          el.addEventListener('click', (function (target) {
            return function () { send({ type: 'seek', index: target }); };
          })(i));
          linesEl.appendChild(el);
        }
      }

      channel.onmessage = function (event) {
        if (event.data && event.data.type === 'state') render(event.data.state);
      };

      // 告知主窗口本页已就绪，主窗口补推一次状态（BroadcastChannel 不缓存历史消息）
      channel.postMessage({ type: 'ready' });

      // 独立弹窗模式下若主页面关闭，窗口随之关闭
      window.addEventListener('pagehide', function () { channel.close(); });
    })();
  </script>
</body>
</html>
